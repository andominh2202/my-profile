<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cvSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="48%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111936"/>
    </linearGradient>
    <radialGradient id="cvCyan" cx="76%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvViolet" cx="24%" cy="68%" r="58%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvMagenta" cx="56%" cy="84%" r="44%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FB923C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cvArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cvOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="cvGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.065"/>
    </pattern>
  </defs>

  <rect width="1600" height="680" fill="url(#cvSky)"/>
  <rect width="1600" height="680" fill="url(#cvCyan)"/>
  <rect width="1600" height="680" fill="url(#cvViolet)"/>
  <rect width="1600" height="680" fill="url(#cvMagenta)"/>
  <rect width="1600" height="680" fill="url(#cvGrid)"/>

  <!-- Cinematic Orbital & Light Beams -->
  <g fill="none">
    <circle cx="1160" cy="240" r="175" stroke="url(#cvOrbit)" stroke-width="1.6"/>
    <circle cx="1160" cy="240" r="255" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="6 10"/>
    <circle cx="1160" cy="240" r="350" stroke="#A78BFA" stroke-opacity="0.12" stroke-width="1"/>
    <path d="M80 510 C 420 310, 820 400, 1520 180" stroke="url(#cvArc)" stroke-width="2.2"/>
    <path d="M640 580 C 920 380, 1240 360, 1580 480" stroke="url(#cvArc)" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- Subtle Starlight & Focal Nodes -->
  <g fill="#E2E8F0">
    <circle cx="1160" cy="240" r="5" fill="#22D3EE"/>
    <circle cx="1160" cy="240" r="16" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="320" cy="180" r="2.2" opacity="0.6"/>
    <circle cx="540" cy="336" r="3" fill="#38BDF8" opacity="0.8"/>
    <circle cx="890" cy="296" r="2.5" fill="#A78BFA" opacity="0.8"/>
    <circle cx="1360" cy="140" r="2.8" fill="#F472B6" opacity="0.75"/>
    <circle cx="210" cy="410" r="2" opacity="0.45"/>
    <circle cx="1430" cy="430" r="2.2" opacity="0.5"/>
  </g>

  <rect x="0" y="576" width="1600" height="1.5" fill="url(#cvArc)" opacity="0.55"/>
</svg>
