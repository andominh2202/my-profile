<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Avatar">
  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0C2438"/>
    </linearGradient>
    <radialGradient id="avHalo" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="avVisor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="avGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="240" height="240" fill="url(#avBg)"/>
  <rect width="240" height="240" fill="url(#avGrid)"/>
  <rect width="240" height="240" fill="url(#avHalo)"/>

  <circle cx="120" cy="108" r="76" fill="none" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="120" cy="108" r="88" fill="none" stroke="#818CF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Shoulders & Torso -->
  <path d="M44 240c6-52 35-82 76-82s70 30 76 82z" fill="url(#avSuit)"/>
  <path d="M90 162l30 34 30-34" fill="none" stroke="#0B1222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Head -->
  <circle cx="120" cy="96" r="41" fill="url(#avSuit)"/>

  <!-- Pro Headset Arc -->
  <path d="M72 98a48 48 0 0 1 96 0" fill="none" stroke="#080B12" stroke-width="8" stroke-linecap="round"/>
  <path d="M75 98a45 45 0 0 1 90 0" fill="none" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- Earcups -->
  <rect x="62" y="84" width="18" height="34" rx="8" fill="#080B12" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="160" y="84" width="18" height="34" rx="8" fill="#080B12" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="68" y="93" width="3" height="16" rx="1.5" fill="#22D3EE"/>
  <rect x="169" y="93" width="3" height="16" rx="1.5" fill="#22D3EE"/>

  <!-- Visor Accent -->
  <rect x="92" y="86" width="56" height="18" rx="9" fill="#080B12" opacity="0.9"/>
  <rect x="100" y="93" width="40" height="4" rx="2" fill="url(#avVisor)"/>
</svg>
